<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PaintYCompanion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body data-palette="bottom">
  <canvas id="board" aria-label="Painting canvas"></canvas>

  <!-- Undo / redo -->
  <div id="history" class="pill">
    <button id="undoBtn" class="icon-btn" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <span class="divider"></span>
    <button id="redoBtn" class="icon-btn" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
  </div>

  <!-- Settings button -->
  <button id="settingsBtn" class="icon-btn corner" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>

  <!-- Palette -->
  <nav id="palette" class="pill" aria-label="Colours"></nav>

  <!-- Colour name flash -->
  <div id="flash" aria-live="polite"></div>

  <!-- Settings sheet -->
  <div id="scrim" hidden></div>
  <aside id="settings" hidden aria-label="Settings">
    <header>
      <h1>PaintYCompanion</h1>
      <button id="closeSettings" class="icon-btn" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <section>
      <h2>Background</h2>
      <div class="seg" id="bgMode">
        <button data-v="builtin">Panjim outline</button>
        <button data-v="url">Image file</button>
        <button data-v="upload">Upload</button>
        <button data-v="none">None</button>
      </div>
      <label class="row" data-show="url">
        <span>Path or URL</span>
        <input id="bgUrl" type="text" placeholder="assets/my-map.png" autocomplete="off" spellcheck="false">
      </label>
      <div class="row" data-show="upload">
        <span id="uploadName">No image chosen</span>
        <label class="btn">Choose image<input id="bgFile" type="file" accept="image/*" hidden></label>
      </div>
      <label class="row">
        <span>Map opacity</span>
        <input id="bgOpacity" type="range" min="0.1" max="1" step="0.05">
      </label>
      <label class="row">
        <span>Map rotation <output id="rotOut"></output></span>
        <input id="mapRotate" type="range" min="-180" max="180" step="1">
      </label>
      <label class="row">
        <span>Map size <output id="scaleOut"></output></span>
        <input id="mapScale" type="range" min="50" max="200" step="1">
      </label>
      <div class="row gap">
        <button id="resetMapTf" class="btn ghost">Reset rotation &amp; size</button>
      </div>
      <label class="row">
        <span>Keep outlines on top of paint</span>
        <input id="outlinesTop" type="checkbox" class="toggle">
      </label>
    </section>

    <section>
      <h2>Palette position</h2>
      <div class="seg" id="palettePos">
        <button data-v="bottom">Bottom</button>
        <button data-v="top">Top</button>
        <button data-v="left">Left</button>
        <button data-v="right">Right</button>
      </div>
    </section>

    <section>
      <h2>Colours</h2>
      <div id="colorList"></div>
      <div class="row gap">
        <button id="addColor" class="btn">Add colour</button>
        <button id="resetColors" class="btn ghost">Reset to defaults</button>
      </div>
    </section>

    <section>
      <h2>Brush</h2>
      <label class="row">
        <span>Size <output id="sizeOut"></output></span>
        <input id="brushSize" type="range" min="2" max="80" step="1">
      </label>
      <label class="row">
        <span>Pen pressure</span>
        <input id="pressure" type="checkbox" class="toggle">
      </label>
      <label class="row">
        <span>Pen only (ignore fingers on canvas)</span>
        <input id="penOnly" type="checkbox" class="toggle">
      </label>
    </section>

    <section>
      <h2>Painting</h2>
      <div class="row gap">
        <button id="saveImage" class="btn">Save as image</button>
        <button id="fullscreen" class="btn ghost">Full screen</button>
      </div>
    </section>

    <p class="fine">Panjim (City of Panaji) outline. Coastline © OpenStreetMap contributors.</p>
  </aside>

  <script src="app.js?v=7"></script>
</body>
</html>
