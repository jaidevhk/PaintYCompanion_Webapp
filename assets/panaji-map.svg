<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Stylised outline sketch of Panaji, Goa. Not to scale. Replace with your own map. -->
  <defs>
    <pattern id="waves" width="40" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 14 q8 -7 16 0 t16 0" fill="none" stroke="#b9d3e3" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1600" height="1100" fill="#eef5fa"/>
  <rect width="1600" height="1100" fill="url(#waves)"/>

  <!-- North bank (Betim / Reis Magos) -->
  <path d="M0,0 H1600 V112 C1400,104 1250,94 1100,100 C900,106 700,94 560,80 C420,66 300,54 200,40 C140,30 60,20 0,14 Z"
        fill="#fff" stroke="#55606b" stroke-width="3" stroke-linejoin="round"/>

  <!-- Panaji peninsula -->
  <path d="M260,250 C380,265 470,285 560,300 C680,318 800,322 920,315 C1040,308 1150,300 1260,292 C1380,284 1490,280 1600,276
           L1600,980 C1450,1000 1300,1015 1150,1010 C950,1005 800,1020 650,1030 C520,1040 420,1030 360,1060
           C320,1082 270,1076 250,1045 C232,1012 262,980 240,950 C210,900 190,840 185,780 C176,690 170,600 175,520
           C180,430 200,340 260,250 Z"
        fill="#fff" stroke="#55606b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Creeks -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="ourem" d="M1330,290 C1335,380 1300,430 1320,500 C1340,570 1400,620 1420,700 C1440,780 1500,840 1520,925" stroke="#55606b" stroke-width="24"/>
    <path d="M1330,286 C1335,380 1300,430 1320,500 C1340,570 1400,620 1420,700 C1440,780 1500,840 1520,925" stroke="#eef5fa" stroke-width="18"/>
    <path d="M600,306 C590,400 640,460 610,540 C585,610 560,680 600,760" stroke="#55606b" stroke-width="16"/>
    <path d="M600,302 C590,400 640,460 610,540 C585,610 560,680 600,760" stroke="#eef5fa" stroke-width="10"/>
  </g>

  <!-- Bridges over the Mandovi -->
  <g stroke-linecap="butt">
    <path d="M1455,284 L1462,108" stroke="#55606b" stroke-width="14"/>
    <path d="M1455,284 L1462,108" stroke="#fff" stroke-width="8"/>
    <path d="M1505,281 L1512,108" stroke="#55606b" stroke-width="14"/>
    <path d="M1505,281 L1512,108" stroke="#fff" stroke-width="8"/>
  </g>

  <!-- Altinho hill contours -->
  <g fill="none" stroke="#a7b0b8" stroke-width="2" stroke-dasharray="8 7">
    <ellipse cx="1150" cy="590" rx="175" ry="105"/>
    <ellipse cx="1150" cy="590" rx="110" ry="62"/>
    <ellipse cx="1150" cy="590" rx="50" ry="26"/>
  </g>

  <!-- Main roads (double-line outline style) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#55606b" stroke-width="13">
      <path d="M300,276 C450,302 560,322 700,336 C850,350 1000,342 1318,316"/>
      <path d="M300,276 C232,380 216,520 220,650 C225,780 250,900 282,1022"/>
      <path d="M1000,402 C900,480 820,560 720,640 C640,700 540,760 420,820"/>
      <path d="M760,410 C950,400 1100,392 1300,386"/>
      <path d="M1300,386 C1290,460 1310,520 1345,585"/>
      <path d="M1352,384 C1440,378 1520,374 1600,372"/>
      <path d="M720,640 C700,760 720,880 760,1002"/>
      <path d="M420,820 C360,900 320,960 284,1022"/>
      <path d="M1000,402 C1040,480 1060,520 1080,520"/>
      <ellipse cx="1150" cy="590" rx="140" ry="84"/>
    </g>
    <g stroke="#fff" stroke-width="7">
      <path d="M300,276 C450,302 560,322 700,336 C850,350 1000,342 1318,316"/>
      <path d="M300,276 C232,380 216,520 220,650 C225,780 250,900 282,1022"/>
      <path d="M1000,402 C900,480 820,560 720,640 C640,700 540,760 420,820"/>
      <path d="M760,410 C950,400 1100,392 1300,386"/>
      <path d="M1300,386 C1290,460 1310,520 1345,585"/>
      <path d="M1352,384 C1440,378 1520,374 1600,372"/>
      <path d="M720,640 C700,760 720,880 760,1002"/>
      <path d="M420,820 C360,900 320,960 284,1022"/>
      <path d="M1000,402 C1040,480 1060,520 1080,520"/>
      <ellipse cx="1150" cy="590" rx="140" ry="84"/>
    </g>
  </g>

  <!-- City-centre street grid -->
  <g stroke="#8b959e" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M820,340 V408 M900,338 V404 M980,335 V400 M1060,330 V396 M1140,326 V392 M1220,322 V388"/>
    <path d="M770,372 H1290"/>
    <path d="M820,412 V470 M900,410 V490 M1240,390 V470"/>
    <path d="M780,450 C860,446 920,444 960,446"/>
    <path d="M430,300 C460,340 470,380 520,420 M380,295 C400,340 380,400 300,430"/>
    <path d="M760,700 C840,690 900,700 980,720 M650,880 C700,870 760,880 840,870 M480,720 C540,700 600,690 660,690"/>
  </g>

  <!-- Landmarks -->
  <g fill="#fff" stroke="#55606b" stroke-width="2.5">
    <rect x="870" y="410" width="60" height="46" rx="4"/>            <!-- Azad Maidan -->
    <path d="M1010,396 l22,-36 l22,36 z"/>                            <!-- Church Square -->
    <rect x="1022" y="372" width="20" height="24"/>
    <rect x="452" y="318" width="70" height="38" rx="6"/>            <!-- Kala Academy, Campal -->
    <circle cx="258" cy="1046" r="10"/>                               <!-- Dona Paula jetty -->
  </g>

  <!-- Labels -->
  <g paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#7d8892" text-anchor="middle" letter-spacing="3">
    <text x="820" y="200" font-size="30" font-style="italic" stroke="#eef5fa" fill="#7ea4bd" letter-spacing="10">MANDOVI RIVER</text>
    <text x="85" y="640" font-size="30" font-style="italic" stroke="#eef5fa" fill="#7ea4bd" letter-spacing="10" transform="rotate(-90 85 640)">ARABIAN SEA</text>
    <text x="1000" y="1078" font-size="22" font-style="italic" stroke="#eef5fa" fill="#7ea4bd" letter-spacing="8">ZUARI</text>
    <text x="1290" y="62" font-size="20">BETIM</text>
    <text x="360" y="32" font-size="20">REIS MAGOS</text>
    <text x="1020" y="300" font-size="40" font-weight="700" fill="#5d6872" letter-spacing="8">PANJIM</text>
    <text x="487" y="390" font-size="18">CAMPAL</text>
    <text x="1235" y="466" font-size="16">FONTAINHAS</text>
    <text x="1495" y="440" font-size="18">PATTO</text>
    <text x="1150" y="596" font-size="18">ALTINHO</text>
    <text x="300" y="560" font-size="18" transform="rotate(-84 300 560)">MIRAMAR</text>
    <text x="380" y="740" font-size="17">CARANZALEM</text>
    <text x="420" y="985" font-size="17">DONA PAULA</text>
    <text x="870" y="800" font-size="20">TALEIGAO</text>
    <text x="660" y="480" font-size="13" fill="#9aa3ab" transform="rotate(-80 660 480)">ST INEZ CREEK</text>
    <text x="1395" y="640" font-size="13" fill="#9aa3ab" transform="rotate(62 1395 640)">OUREM CREEK</text>
  </g>

  <!-- Compass -->
  <g transform="translate(1530,190)" fill="none" stroke="#7d8892" stroke-width="2.5">
    <circle r="34" fill="#fff"/>
    <path d="M0,-26 L9,6 L0,0 L-9,6 Z" fill="#7d8892"/>
    <text y="-42" font-size="18" text-anchor="middle" fill="#7d8892" stroke="none" font-family="system-ui, sans-serif">N</text>
  </g>
</svg>
